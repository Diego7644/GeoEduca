<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEOEDUCA - Control Escolar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('geoeduca-a11y');
          var prefs = raw ? JSON.parse(raw) : { theme: 'auto' };
          var dark = prefs.theme === 'dark' || (prefs.theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? 'dark' : 'light';
          root.dataset.themeChoice = prefs.theme || 'auto';
          if (prefs.contrast === 'high') root.dataset.contrast = 'high';
          if (prefs.textSize) root.dataset.textSize = prefs.textSize;
          if (prefs.spacing === 'roomy') root.dataset.spacing = 'roomy';
          if (prefs.links) root.dataset.links = 'on';
          if (prefs.motion === 'reduce') root.dataset.motion = 'reduce';
          if (prefs.easy) root.dataset.easy = 'on';
          if (prefs.guided) root.dataset.guided = 'on';
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
